services:
  postgres:
    image: postgres:15-alpine
    container_name: fleet_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: fleet_db
    ports:
      # 5433 no seu PC -> 5432 dentro do container (a 5432 já está ocupada)
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleet_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fleet_api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    # env_file carrega as variáveis "fixas" do .env (JWT, AWS, CEP, admin...).
    # DATABASE_URL é sobrescrita logo abaixo porque, de dentro do container, o Postgres
    # não é "localhost:5433" (isso é só o mapeamento pro host) e sim "postgres:5432"
    # (nome do serviço na rede interna do compose, porta interna do Postgres).
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:root@postgres:5432/fleet_db?schema=public"
      PORT: 3000
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
